version: "3.9"

services:

  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
    command: mongod --replSet rs0 --bind_ip_all
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongodb -u ${MONGO_USER} -p ${MONGO_PASS} --authenticationDatabase admin
      --eval "try { rs.status() } catch(e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongodb:27017' }] }) }"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data

  backend:
    image: 040480027454.dkr.ecr.us-east-1.amazonaws.com/galaxy-back:latest
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file: .env.prod
    environment:
      NODE_ENV:   production
      PORT:       1331
      MONGO_URI:  mongodb://${MONGO_USER}:${MONGO_PASS}@mongodb:27017/galaxy?authSource=admin&replicaSet=rs0
      REDIS_URL:  redis://redis:6379

  frontend:
    image: 040480027454.dkr.ecr.us-east-1.amazonaws.com/galaxy-front:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
