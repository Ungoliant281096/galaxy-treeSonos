name: Deploy to production

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  AWS_ACCOUNT_ID: "040480027454"
  AWS_REGION:     us-east-1
  ECR_REGISTRY:   040480027454.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    name: Build → ECR → Servidor
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push backend
        run: |
          docker build -t $ECR_REGISTRY/galaxy-back:${{ github.sha }} .
          docker push     $ECR_REGISTRY/galaxy-back:${{ github.sha }}
          docker tag      $ECR_REGISTRY/galaxy-back:${{ github.sha }} $ECR_REGISTRY/galaxy-back:latest
          docker push     $ECR_REGISTRY/galaxy-back:latest

      - name: Build & push frontend
        run: |
          docker build -t $ECR_REGISTRY/galaxy-front:${{ github.sha }} ./client
          docker push     $ECR_REGISTRY/galaxy-front:${{ github.sha }}
          docker tag      $ECR_REGISTRY/galaxy-front:${{ github.sha }} $ECR_REGISTRY/galaxy-front:latest
          docker push     $ECR_REGISTRY/galaxy-front:latest

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key:      ${{ secrets.PROD_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | \
              docker login --username AWS --password-stdin 040480027454.dkr.ecr.us-east-1.amazonaws.com
            cd /opt/galaxy
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
